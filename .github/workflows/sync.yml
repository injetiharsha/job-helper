name: Job Helper Lifecycle Sync

on:
  # 1. Real Webhook Trigger (via Google Apps Script or curl)
  repository_dispatch:
    types: [job_application_received]

  # 2. Daily Cron Schedule (Runs every day at 03:30 UTC = 09:00 AM IST)
  schedule:
    - cron: '30 3 * * *'

  # 3. Manual Run Button in GitHub Web / Mobile UI
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Execute Job Helper Sync Engine
        env:
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          python run_sync.py
